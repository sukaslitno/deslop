[package]
name = "deslop"
version = "0.1.2"
description = "A macOS utility for reviewing disk usage and cleaning regenerable caches"
authors = ["sukaslitno"]
edition = "2021"

[lib]
name = "deslop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
quick-xml = "0.39"

# Vendored `time` with a one-line coherence fix (see vendor/time NOTE).
# Required because the sandbox's crate graph (cookie 0.18.1 / tauri-utils +
# time 0.3.48) hits a spurious E0119 on every available rustc otherwise.
[patch.crates-io]
time = { path = "../vendor/time" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
