name: Verify Deslop

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app typecheck
      - run: pnpm --dir app test:state
      - run: pnpm --dir app exec playwright install chromium
      - run: pnpm --dir app test:ui
      - run: pnpm --dir app build
      - run: rustup component add --toolchain 1.88.0 rustfmt clippy
      - run: cargo fmt --check
        working-directory: app/src-tauri
      - run: cargo clippy --lib --tests -- -D warnings
        working-directory: app/src-tauri
      - run: cargo test --lib
        working-directory: app/src-tauri
