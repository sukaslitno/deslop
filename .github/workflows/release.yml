name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build DMG
        working-directory: app
        run: pnpm tauri build --bundles dmg --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: deslop-${{ matrix.target }}
          path: app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Deslop $GITHUB_REF_NAME" \
              --notes "macOS installers for Apple Silicon and Intel Macs. These builds are not code-signed or notarized yet; macOS may require Control-click → Open on first launch." \
              release-assets/*.dmg
          fi
